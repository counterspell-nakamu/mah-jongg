<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>麻雀記録</title>
<style>
:root{--bg:#f3efe4;--card:#fffdf6;--ink:#1c2b24;--sub:#6b766f;--g:#1f4d3a;--line:#d9d3c0;--pos:#1f6b45;--neg:#b3261e;--warn:#fff1c2}
@media(prefers-color-scheme:dark){:root{--bg:#14211b;--card:#1c2e26;--ink:#ece8da;--sub:#9aa89f;--g:#4e9a78;--line:#2f453b;--pos:#6fcf9d;--neg:#ff8a80;--warn:#4a3f14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0 auto;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:0 12px 60px;max-width:1000px}
nav{display:flex;position:-webkit-sticky;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
nav button{flex:1;margin-right:4px;padding:14px 1px;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
nav button:last-child{margin-right:0}
nav button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h3{margin:0 0 10px;font-size:18px}
input,select,button,textarea{font:inherit;color:var(--ink)}
input,select,textarea{min-height:48px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input[type=checkbox]{width:28px;min-height:28px;margin:0 10px 0 0}
input.auto{border-style:dashed;border-color:var(--g);color:var(--g);font-weight:700}
input[type=number]{text-align:center;font-size:22px;font-weight:700}
.btn{padding:13px 18px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#fff;font-weight:700;margin:4px 4px 4px 0;font-size:17px}
.btn.s{background:transparent;color:var(--g)}.btn.d{background:transparent;color:var(--neg);border-color:var(--neg)}
.btn.big{width:100%;padding:18px;font-size:20px;margin:8px 0 0}
.warn{background:var(--warn);padding:8px 12px;border-radius:8px;margin:6px 0;font-size:15px}
.ok{background:#d8efdf;color:#134d2a}
.pos{color:var(--pos)}.neg{color:var(--neg)}.sub{color:var(--sub);font-size:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--g);font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;grid-gap:8px}.g3{grid-template-columns:1fr 1fr 1fr}.g label{font-size:14px;color:var(--sub)}
.gm{border-top:1px solid var(--line);padding:10px 0}
.dh{font-weight:700;color:var(--g);font-size:18px}
.pl{display:flex;justify-content:space-between;align-items:center}
.pb{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.hd{display:flex;align-items:center}.hd select{flex:1;margin:0 8px;font-size:19px}
.seat{width:48px;height:48px;line-height:48px;text-align:center;border-radius:50%;background:var(--g);color:#fff;font-weight:700;font-size:22px;flex:none}
.seat.e{background:var(--neg)}
.wd{display:inline-block;width:1.6em;text-align:center;border-radius:50%;background:var(--g);color:#fff;font-size:13px}
.mv{width:52px;height:48px;margin-left:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:20px}
.sr{display:grid;grid-gap:5px;margin:8px 0 0;grid-template-columns:62px repeat(3,1fr) 1.5fr repeat(3,1fr) .9fr}
.b{min-height:54px;padding:0;font-size:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.b:active{background:var(--g);color:#fff}.b:disabled,.mv:disabled{opacity:.3}
.lb{min-height:54px;padding:0;font-size:15px;border:1px dashed var(--g);background:transparent;color:var(--g);border-radius:10px}
.lb.on{background:var(--g);color:#fff;border-style:solid;font-weight:700}.lb.on:disabled{color:#fff}
.cc{display:flex;align-items:center;justify-content:flex-end}.cc .b{width:52px;margin:0 3px}.cc input{width:84px}
.yr{display:flex;flex-wrap:wrap;align-items:center;margin:6px 0}.yr select{width:auto;margin:0 6px 6px 0}
.tt{border:1px solid var(--line);border-radius:10px;padding:10px}
.ft{display:flex;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
</style></head><body><div id="app"></div>

/* ======================== */
var app=document.getElementById("app"),WN=["東","南","西","北"],GAP=8*36e5;

var FTS=[["ym","役満の記録（入力画面）"],["hall","役満殿堂"],["show","精算の発表（音楽と読み上げ）"],["hl","精算のハイライト"],["titles","称号"],["graph","成績の推移グラフ"],["rel","対戦相性表"],["mvp","月間・年間MVP／ブービー"],["se","効果音・ファンファーレ"]];

var DEF={players:[],games:[],sess:{},settings:{start:25000,ret:30000,uma:[20,10,-10,-20],rate:0,chipRate:0,gr:1,round:"gosha",yomi:"",ft:{ym:true,hall:true,show:true,hl:true,titles:true,graph:true,rel:true,mvp:true,se:true}},meta:{lastBackup:null}};

var S=cl(DEF),ui={tab:"input",sub:"hall",ptype:"all",pval:"",seat:"",sk:"pt",sd:-1,edit:null,dr:null,undo:null,exp:null,sid:null,busy:false,annText:"",annSid:null};
var local=FB.apiKey.indexOf("YOUR")==0,ref=null,dirty=0;
var oldIOS=(()=>{var m=/(iPad|iPhone).*OS (\d+)_/.exec(navigator.userAgent);return !!m&&+m[2]<13})();

var f=v=>{v=Math.round(v*10)/10;return`<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":""}${v}</span>`};
var fg=v=>{v=Math.round(v);return`<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":v<0?"−":""}${String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g,",")}G</span>`};

var cmpA=(a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||"")||a.t-b.t;

/* ---- 音・読み上げ ---- */
var AC=null,FAN=[[523,.14],[523,.14],[523,.14],[659,.18],[784,.18],[1047,.55]],BLIP=[[880,.07],[1175,.09]],JING=[[523,.16],[659,.16],[784,.16],[1047,.28],[784,.12],[1047,.5]];
function play(notes){if(!S.settings.ft.se)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();var t=AC.currentTime+.02;
 notes.forEach(n=>{var o=AC.createOscillator(),gn=AC.createGain();o.type="triangle";o.frequency.value=n[0];gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.25,t+.02);gn.gain.exponentialRampToValueAtTime(.0001,t+n[1]);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+n[1]+.05);t+=n[1]*.9})}catch(e){}}
var YOMI={"国士無双十三面":"コクシムソウジュウサンメン","国士無双":"コクシムソウ","四暗刻単騎":"スーアンコータンキ","四暗刻":"スーアンコー","大三元":"ダイサンゲン","小四喜":"ショースーシー","大四喜":"ダイスーシー","字一色":"ツーイーソー","緑一色":"リューイーソー","清老頭":"チンロートー","純正九蓮宝燈":"ジュンセイチューレンポートー","九蓮宝燈":"チューレンポートー","四槓子":"スーカンツ","天和":"テンホー","地和":"チーホー","数え役満":"カゾエヤクマン",
"半荘":"ハンチャン","役満":"ヤクマン","結果発表":"ケッカハッピョウ","発表":"ハッピョウ","結果":"ケッカ","精算":"セイサン","時間":"ジカン","本日":"ホンジツ","今日":"キョウ","一日":"イチニチ","全":"ゼン","お疲れさま":"おつかれさま","最高得点":"サイコウトクテン","得点":"トクテン","一方":"イッポー","次":"ツギ","巻き返し":"まきかえし","大勝利":"ダイショーリ","お見事":"おみごと","平和":"ヘイワ","伝説":"デンセツ","遊び":"あそび","対局":"タイキョク","会い":"あい","出ない":"でない","出ました":"でました"};
var YKEYS=Object.keys(YOMI).sort((a,b)=>b.length-a.length);
/* 読み上げ専用：画面の表示は漢字のまま、声に出すときだけかなに置き換える（設定の「言葉=読み」が優先） */
function yomi(t){var L=(S.settings.yomi||"").split("\n").map(l=>l.split("=")).filter(p=>p.length==2&&p[0].trim()).map(p=>[p[0].trim(),p[1].trim()]).sort((a,b)=>b[0].length-a[0].length);
 L.concat(YKEYS.map(k=>[k,YOMI[k]])).forEach(p=>{t=t.split(p[0]).join(p[1])});return t}
function speak(text){try{var s=window.speechSynthesis;if(!s)return;s.cancel();var u=new SpeechSynthesisUtterance(yomi(text));u.lang="ja-JP";var v=s.getVoices().filter(x=>/^ja/i.test(x.lang))[0];if(v)u.voice=v;u.rate=.95;s.speak(u)}catch(e){}}

function fixSid(){var pv=null;S.games.slice().sort(cmpA).forEach(g=>{if(!g.sid)g.sid=(pv&&ts(g.date,g.time)-ts(pv.date,pv.time)<GAP)?pv.sid:"s"+g.id;pv=g})}
function merge(d){var ds=d.settings||{};S=Object.assign(cl(DEF),d,{settings:Object.assign({},DEF.settings,ds,{ft:Object.assign({},DEF.settings.ft,ds.ft||{})}),meta:Object.assign({},DEF.meta,d.meta||{}),sess:d.sess||{}});fixSid()}
function keep(){try{if(ui.dr&&!ui.edit)localStorage.setItem("mjd",JSON.stringify(ui.dr))}catch(e){}}
async function save(nr){if(!nr)render();var j=cl(S);dirty++;
 try{if(local)localStorage.setItem("mj",JSON.stringify(j));else await ref.set(j)}catch(e){alert("保存に失敗しました: "+e.message)}
 dirty--}

/* ---- 会（セッション）・精算 ---- */
function sessions(){var m={},o=[];S.games.slice().sort(cmpA).forEach(g=>{var s=m[g.sid];if(!s){s=m[g.sid]={sid:g.sid,gs:[]};o.push(s)}s.gs.push(g)});
 o.forEach(s=>{s.sd=s.gs[0].date;s.ed=s.gs[s.gs.length-1].date});return o.reverse()}
var lbl=s=>s.sd.slice(0,4)+"/"+sd5(s.sd)+(s.ed!=s.sd?"〜"+sd5(s.ed):"");
function settle(s){
 var st=S.settings,ch=(S.sess[s.sid]||{}).chips||{},P={},u=st.gr||1,rg=v=>Math.round(v/u)*u;
 s.gs.forEach(g=>g.ps.forEach(x=>{var o=P[x.p]||(P[x.p]={id:x.p,n:0,pt:0});o.n++;o.pt+=x.pt}));
 var ids=Object.keys(P),ent=ids.filter(id=>ch[id]!==undefined&&ch[id]!==""),au=null,sum=0;
 if(ids.length>1&&ent.length==ids.length-1)au=ids.find(id=>ent.indexOf(id)<0);
 ent.forEach(id=>{sum+=+ch[id]||0});
 var rows=ids.map(id=>{var o=P[id];o.au=id==au;o.c=ent.indexOf(id)>=0?(+ch[id]||0):(id==au?-sum:null);
  o.pg=rg(o.pt*st.rate);o.cg=o.c==null?0:rg(o.c*st.chipRate);o.tg=o.pg+o.cg;return o});
 rows.sort((a,b)=>b.tg-a.tg||b.pt-a.pt);
 return{rows:rows,full:ent.length==ids.length,sum:sum}}

 if(ui.ptype!="all"){ss.forEach(s=>{o[s.sd.slice(0,n)]=1});vals=Object.keys(o).sort().reverse();if(vals.indexOf(ui.pval)<0)ui.pval=vals[0]||""}
 return{vals:vals,sel:ss.filter(s=>ui.ptype=="all"||s.sd.indexOf(ui.pval)==0)}}
var perHTML=P=>`<label>期間<select data-g="ptype"><option value="all">全期間</option><option value="year"${ui.ptype=="year"?" selected":""}>年別</option><option value="month"${ui.ptype=="month"?" selected":""}>月別</option></select></label>
 <label>対象<select data-g="pval"${ui.ptype=="all"?" disabled":""}>${P.vals.map(v=>`<option${v==ui.pval?" selected":""}>${v}</option>`).join("")}</select></label>`;
function pgames(P){var gs=[];P.sel.forEach(s=>s.gs.forEach(g=>gs.push(g)));return gs.sort(cmpA)}

/* ---- 計算 ---- */
function calc(rows,st){
 if(rows.some(r=>!r.p||r.s===""))return null;
 var o=rows.map((r,i)=>({i:i,s:Math.round(+r.s*100)})).sort((a,b)=>b.s-a.s||a.i-b.i);
 var rd=v=>st.round=="gosha"?(v>=0?Math.ceil(v-.5):-Math.ceil(-v-.5)):Math.round(v);
 var sum=0,res=[];o.forEach((x,k)=>{x.rank=k+1;if(k){x.pt=rd((x.s-st.ret)/1000)+st.uma[k];sum+=x.pt}});
 o[0].pt=-sum;o.forEach(x=>{res[x.i]={rank:x.rank,pt:x.pt}});return res}
function bal(){var d=ui.dr,T=S.settings.start*4/100,man=d.rows.filter(r=>r.s!==""&&!r.au);
 if(man.length==3){var t=d.rows.find(r=>r.s===""||r.au),sum=0;man.forEach(r=>{sum+=+r.s||0});t.s=String(Math.round((T-sum)*100)/100);t.au=true}
 else d.rows.forEach(r=>{if(r.au){r.s="";r.au=false}})}
function newDr(ids,date,fresh){
 if(!fresh&&!ids){try{var sv=JSON.parse(localStorage.getItem("mjd")||"null");if(sv&&sv.rows&&sv.rows.length==4){ui.dr=sv;return}}catch(e){}}
 var l=S.games.slice().sort((a,b)=>b.t-a.t)[0],base=ids||(l?l.ps.map(x=>x.p):plist().slice(0,4).map(p=>p.id));
 ui.dr={date:date||today(),time:nowT(),flip:false,ym:[],rows:[0,1,2,3].map(i=>({p:base[i]||"",s:"",au:false}))}}

function sessInfo(){
 var d=draft(),gs=S.games.filter(g=>g.id!=ui.edit).sort(cmpA),t=ts(d.date,d.time),prev=null;
 gs.forEach(g=>{if(ts(g.date,g.time)<=t)prev=g});
 var auto=!!prev&&t-ts(prev.date,prev.time)<GAP,cont=!!prev&&(d.flip?!auto:auto);

  :`<b>新しい会</b>の1戦目${s.prev?' <button class="btn s" data-a="flip">前の会に続ける</button>':""}`}

 if(s.cont)s.sg.forEach(g=>g.ps.forEach(x=>{var o=m[x.p]||(m[x.p]={n:0,t:0});o.n++;o.t+=x.pt}));

function pvHTML(){
 var d=draft(),st=S.settings,T=st.start*4,h="",ids=d.rows.map(x=>x.p).filter(Boolean),n=d.rows.filter(r=>r.s!=="").length;

 if(!r)return h+`<p class="sub">${n<4?"あと"+(4-n)+"人分の素点を入れる":"4人分のメンバーを選ぶ"}と結果が出ます（3人入れると残り1人は自動）</p>`;

  var lb=q('[data-lb="'+i+'"]');if(lb){lb.textContent=r.au?"自動":"消す";lb.disabled=!!r.au;lb.classList.toggle("on",!!r.au)}
  app.querySelectorAll('[data-i="'+i+'"][data-a="adj"],[data-i="'+i+'"][data-a="neg"]').forEach(b=>{b.disabled=!!r.au})});

function ymRow(y,i){
 var rows=draft().rows,pl=k=>rows.map((r,z)=>`<option value="${z}"${y[k]===z?" selected":""}>${WN[z]} ${esc(nm(r.p))}</option>`).join("");

function vInput(){
 if(S.players.length<4)return'<div class="card">先に「メンバー」タブで4人以上登録してください。</div>';
 var d=draft(),opts='<option value="">選択</option>'+plist().map(p=>`<option value="${p.id}">${esc(p.name)}${p.reg?"":"（控え）"}</option>`).join("");

function hlHTML(s){

 var ln=(l,r)=>`<div class="pl"><span>${l}</span><span>${r}</span></div>`;

  +ln("役満",ym.length?ym.map(y=>esc(nm(y.w))+" "+esc(y.k)).join("、"):'<span class="sub">なし</span>')}
function announce(s){
 var st=S.settings,r=settle(s).rows,gd=st.rate>0||st.chipRate>0,k=gd?"tg":"pt",sr=r.slice().sort((a,b)=>b[k]-a[k]);
 var sp=o=>gd?(o.tg>=0?"プラス":"マイナス")+Math.abs(o.tg)+"ゴールド":(o.pt>=0?"プラス":"マイナス")+Math.abs(o.pt)+"ポイント";
 var t=[pick(["結果発表です。","精算の時間です。","お待たせしました。精算結果を発表します。"]),"全"+s.gs.length+"半荘、お疲れさまでした。"],a=sr[0],z=sr[sr.length-1],b=null,ym=[];

 if(sr.length>1)t.push("一方、"+nm(z.id)+"さんは"+sp(z)+"。"+pick(["次は巻き返しましょう。","まだまだこれからです。","ドンマイです。"]));
 s.gs.forEach(g=>{g.ps.forEach(x=>{if(!b||x.s>b.s)b=x});(g.ym||[]).forEach(y=>ym.push(y))});
 if(b)t.push("最高得点は"+nm(b.p)+"さんの"+b.s+"点でした。");
 t.push(ym.length?"本日は役満が"+ym.length+"回出ました。"+ym.map(y=>nm(y.w)+"さんの"+y.k).join("、")+"。"+pick(["伝説の一日です。","すばらしい。"]):pick(["役満の出ない平和な一日でした。","今日は役満はありませんでした。"]));
 t.push(pick(["それでは、また次の対局でお会いしましょう。","また遊びましょう。"]));return t.join("")}
function vSettle(){

 if(!st.rate&&!st.chipRate)h+='<p class="warn">設定タブで「1pt＝何G」「チップ1枚＝何G」を入れると、ゴールドが計算されます。</p>';

 h+=`<tr><td>合計</td><td></td><td></td><td></td><td>${r.full?f(r.sum):""}</td><td></td><td>${fg(tot)}</td></tr></table></div>`;
 if(r.full&&r.sum!=0)h+=`<p class="warn">チップの合計が${r.sum}枚です（本来0）</p>`;

function hallHTML(gs){

 if(!L.length)return'<p class="sub">この期間の役満はまだありません。</p>';

 return`<h3>回数ランキング</h3>${ids.map(id=>`<div class="pl"><span>${esc(nm(id))}</span><b>${C[id]}回</b></div>`).join("")}<h3 style="margin-top:14px">役満の記録</h3><div class="tw"><table><tr><th>日付</th><th>和了者</th><th>役</th><th>形</th><th>放銃</th></tr>
 ${L.reverse().map(z=>`<tr><td>${z.g.date}</td><td>${esc(nm(z.y.w))}</td><td>${esc(z.y.k)}</td><td>${z.y.t}</td><td>${z.y.f?esc(nm(z.y.f)):"－"}</td></tr>`).join("")}</table></div>`}
function titlesHTML(gs){
 var M={};
 gs.forEach(g=>g.ps.forEach(x=>{var o=M[x.p]||(M[x.p]={n:0,rk:0,mt:0,ma:0,ct:0,ca:0,bs:-1e9,bd:"",bp:-1e9,wp:1e9,ym:0});o.n++;o.rk+=x.rank;
  if(x.rank==1){o.ct++;if(o.ct>o.mt)o.mt=o.ct}else o.ct=0;
  if(x.rank<4){o.ca++;if(o.ca>o.ma)o.ma=o.ca}else o.ca=0;
  if(x.s>o.bs){o.bs=x.s;o.bd=g.date}if(x.pt>o.bp)o.bp=x.pt;if(x.pt<o.wp)o.wp=x.pt}));
 gs.forEach(g=>(g.ym||[]).forEach(y=>{if(M[y.w])M[y.w].ym++}));
 var ids=Object.keys(M);if(!ids.length)return'<p class="sub">この期間の記録がありません。</p>';
 var best=(key,ok,dir)=>{var b=null;ids.forEach(id=>{var o=M[id];if(!ok(o))return;var v=key(o);if(!b||(dir>0?v>b.v:v<b.v))b={id:id,v:v}});return b};
 var T=[["連勝王",best(o=>o.mt,o=>o.mt>=2,1),b=>b.v+"連続トップ"],["ラス回避王",best(o=>o.ma,o=>o.ma>=5,1),b=>b.v+"戦連続でラスなし"],
  ["最高得点",best(o=>o.bs,o=>o.n>0,1),b=>b.v+"点（"+M[b.id].bd+"）"],["大勝ち（1戦）",best(o=>o.bp,o=>o.n>0,1),b=>"+"+b.v+" pt"],["大沈み（1戦）",best(o=>o.wp,o=>o.n>0,-1),b=>b.v+" pt"],
  ["役満王",best(o=>o.ym,o=>o.ym>0,1),b=>b.v+"回"],["安定王",best(o=>o.rk/o.n,o=>o.n>=5,-1),b=>"平均"+b.v.toFixed(2)+"位"],["皆勤賞",best(o=>o.n,o=>o.n>0,1),b=>b.v+"戦"]];
 return'<div class="g">'+T.filter(t=>t[1]).map(t=>`<div class="tt"><div class="sub">${t[0]}</div><b>${esc(nm(t[1].id))}</b><div>${t[2](t[1])}</div></div>`).join("")+'</div><p class="sub" style="margin-top:8px">連勝王は2連続以上、ラス回避王は5戦以上、安定王は5戦以上の人が対象です。</p>'}
function graphHTML(gs){
 if(gs.length<2)return'<p class="sub">2戦以上の記録があると表示されます。</p>';
 var ids=[],cum={},sr={},N=gs.length;
 gs.forEach(g=>g.ps.forEach(x=>{if(!(x.p in cum)){cum[x.p]=0;sr[x.p]=[0];ids.push(x.p)}}));
 gs.forEach(g=>{var pm={};g.ps.forEach(x=>{pm[x.p]=x.pt});ids.forEach(id=>{if(pm[id]!==undefined)cum[id]+=pm[id];sr[id].push(cum[id])})});
 var mn=0,mx=0;ids.forEach(id=>sr[id].forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v}));if(mx==mn)mx=mn+1;
 var W=700,H=320,L=48,R=12,T=14,B=24,X=i=>L+i*(W-L-R)/N,Y=v=>T+(mx-v)*(H-T-B)/(mx-mn),C=["#1f7a4d","#c0392b","#2563eb","#d97706","#7c3aed","#0891b2","#be185d","#4d7c0f"];
 var svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#999" stroke-dasharray="4 4"/>`
  +[mx,0,mn].map(v=>`<text x="${L-6}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="#888">${Math.round(v)}</text>`).join("")
  +ids.map((id,k)=>`<polyline fill="none" stroke="${C[k%8]}" stroke-width="3" stroke-linejoin="round" points="${sr[id].map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"/>`).join("")+"</svg>";

function relHTML(gs){

 <div class="g" style="grid-template-columns:1fr auto;margin-top:8px"><input id="np" placeholder="新しいメンバー名"><button class="btn" data-a="addp">追加</button></div></div>`}
function vSet(){
 var s=S.settings,n=(k,l,v)=>`<label>${l}<input type="number" step="any" data-s="${k}" value="${v}"></label>`;
 return(ui.exp?`<div class="card"><h3>書き出しデータ</h3><p class="sub">この端末では保存できないため、下の文字を全選択してコピーし、メモなどに貼り付けて保存してください（PCのブラウザから書き出すのが確実です）。</p><textarea readonly rows="8" style="width:100%" onfocus="this.select()">${esc(ui.exp)}</textarea><button class="btn s" data-a="cx">閉じる</button></div>`:"")
 +`<div class="card"><h3>ルール設定</h3><div class="g">${n("start","持ち点",s.start)}${n("ret","返し点",s.ret)}${n("u1","ウマ 2位",s.uma[1])}${n("u2","ウマ 3位",s.uma[2])}${n("u3","ウマ 4位",s.uma[3])}${n("rate","1pt＝何G",s.rate)}${n("chipRate","チップ1枚＝何G",s.chipRate)}
 <label>G端数の丸め<select data-s="gr"><option value="1"${s.gr==1?" selected":""}>丸めない</option><option value="10"${s.gr==10?" selected":""}>10G単位</option><option value="100"${s.gr==100?" selected":""}>100G単位</option></select></label>
 <label>ポイント端数処理<select data-s="round"><option value="gosha"${s.round=="gosha"?" selected":""}>五捨六入</option><option value="shisha"${s.round=="shisha"?" selected":""}>四捨五入</option></select></label></div>
 <p class="sub">持ち点・返し点は通常の点数（25000など）で入力。1位のポイントは他3人の合計の逆数で自動計算（オカ込み）。変更しても過去の記録は再計算されません。</p></div>
 <div class="card"><h3>機能のオン/オフ</h3><p class="sub">オフにしても記録は消えません。オンに戻すと元どおり表示されます。</p>${FTS.map(x=>`<label class="ft"><input type="checkbox" data-ft="${x[0]}"${s.ft[x[0]]?" checked":""}>${x[1]}</label>`).join("")}</div>
 <div class="card"><h3>読み上げの読み方</h3><p class="sub">発表の読み上げで、読み間違える言葉を直せます。1行に「言葉=読み」の形で書きます（例: 半荘=ハンチャン）。入れた内容が優先されます。</p><textarea data-t2="yomi" rows="4" style="width:100%" placeholder="言葉=読み">${esc(s.yomi||"")}</textarea><button class="btn s" data-a="ytest">読み上げテスト</button><p class="sub" id="yT">上の欄に書いた言葉を、読みに直して読み上げます（何も書いていないときは見本を読みます）。</p></div>
 <div class="card"><h3>バックアップ</h3><p class="sub">最終: ${S.meta.lastBackup||"なし"}　／　保存先: ${local?"この端末のみ":"Firebase"}</p>
 <button class="btn" data-a="exj">JSONで書き出し（復元用）</button><button class="btn s" data-a="exc">CSVで書き出し（Excel用）</button><button class="btn s" data-a="imp">JSONを読み込み（復元）</button><input type="file" id="fi" accept=".json,application/json" data-imp="1" hidden></div>
 <div class="card"><h3>データ管理</h3><p class="sub">対局の記録とチップ記録をすべて消します（メンバーは残ります）。先にバックアップを取ってください。</p><button class="btn d" data-a="wipe">全記録を削除</button></div>`}

function render(){
 var ft=S.settings.ft,more=ft.hall||ft.titles||ft.graph||ft.rel;
 if(ui.tab=="more"&&!more)ui.tab="input";
 var tabs=[["input","入力"],["hist","履歴"],["settle","精算"],["stat","集計"]].concat(more?[["more","ほか"]]:[],[["mem","メンバー"],["set","設定"]]);
 var h='<nav>'+tabs.map(t=>`<button data-a="tab" data-k="${t[0]}" class="${ui.tab==t[0]?"on":""}">${t[1]}</button>`).join("")+'</nav>';
 var days=S.meta.lastBackup?(Date.now()-new Date(S.meta.lastBackup))/864e5:999;
 if(days>30)h+=`<p class="warn">${S.meta.lastBackup?"最終バックアップから"+Math.floor(days)+"日経過":"まだバックアップしていません"}。設定タブから書き出してください。</p>`;
 if(local)h+='<p class="warn">Firebase未設定のため、この端末内のみに保存しています。</p>';
 app.innerHTML=h+({input:vInput,hist:vHist,settle:vSettle,stat:vStat,more:vMore,mem:vMem,set:vSet})[ui.tab]();keep()}

function dl(name,txt,type){
 if(oldIOS){ui.exp=txt;ui.tab="set";return}
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a)}
async function backed(){S.meta.lastBackup=today();await save()}
function doImport(file){var rd=new FileReader();rd.onload=()=>{try{var j=JSON.parse(rd.result);if(!Array.isArray(j.players)||!Array.isArray(j.games))throw 0;
 if(!confirm("現在のデータを置き換えます。\n読み込む内容: メンバー"+j.players.length+"人 / "+j.games.length+"半荘\nよろしいですか？"))return;merge(j);save().then(()=>alert("復元しました"))}catch(err){alert("読み込めませんでした。書き出したJSONファイルを選んでください。")}};rd.readAsText(file)}
var so=sid=>S.sess[sid]||(S.sess[sid]={chips:{}});
function cleanSess(){var ok={};S.games.forEach(g=>{ok[g.sid]=1});Object.keys(S.sess).forEach(k=>{if(!ok[k])delete S.sess[k]})}

/* ---- イベント ---- */
app.addEventListener("input",e=>{var k=e.target.dataset.f;if(!k)return;var d=draft(),v=e.target.value;
 if(k=="date"||k=="time")d[k]=v;
 else{var r=d.rows[+k[1]];if(k[0]=="p")r.p=v;else{r.s=v;r.au=false;bal()}}
 sync()});
app.addEventListener("change",e=>{var t=e.target,d=t.dataset;
 if(d.s){var k=d.s;if(k[0]=="u"&&k.length==2)S.settings.uma[+k[1]]=+t.value;else S.settings[k]=k=="round"?t.value:+t.value;save()}
 if(d.ft){S.settings.ft[d.ft]=t.checked;save()}
 if(d.t2!==undefined){S.settings[d.t2]=t.value;save(true)}
 if(d.g){ui[d.g]=t.value;if(d.g=="ptype")ui.pval="";render()}
 if(d.y){var pr=d.y.split(":"),y=draft().ym[+pr[0]],fk=pr[1];
  if(fk=="w")y.w=+t.value;else if(fk=="f")y.f=t.value===""?"":+t.value;else{y[fk]=t.value;if(fk=="t"&&t.value=="ツモ")y.f=""}render()}
 if(d.c!==undefined){var ch=so(ui.sid).chips;if(t.value==="")delete ch[d.c];else ch[d.c]=t.value;save()}
 if(d.imp&&t.files[0])doImport(t.files[0])});
app.addEventListener("click",async e=>{var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a,k=b.dataset.k,i=+b.dataset.i;
 if(a=="tab"){ui.tab=k;ui.undo=null;render()}
 else if(a=="sub"){ui.sub=k;render()}
 else if(a=="adj"){var r=draft().rows[i];if(r.au)return;var base=r.s===""?S.settings.start/100:+r.s;r.s=String(base+ +b.dataset.d);bal();sync()}
 else if(a=="neg"){var r2=draft().rows[i];if(r2.s!==""){r2.s=String(-(+r2.s));bal();sync()}}
 else if(a=="clr"){var r3=draft().rows[i];r3.s="";r3.au=false;bal();sync()}
 else if(a=="flip"){var d0=draft();d0.flip=!d0.flip;sync()}
 else if(a=="yadd"){draft().ym.push({w:0,k:YK[0],t:"ロン",f:""});render()}
 else if(a=="ydel"){draft().ym.splice(i,1);render()}
 else if(a=="mv"){var rs=draft().rows,j=i+ +b.dataset.d,t=rs[i].p;rs[i].p=rs[j].p;rs[j].p=t;render()}
 else if(a=="shuf"){var rs2=draft().rows,ps=rs2.map(x=>x.p);for(var n=ps.length-1;n>0;n--){var m=Math.floor(Math.random()*(n+1)),tmp=ps[n];ps[n]=ps[m];ps[m]=tmp}rs2.forEach((x,z)=>{x.p=ps[z]});render()}
 else if(a=="sort"){if(ui.sk==k)ui.sd*=-1;else{ui.sk=k;ui.sd=(k=="name"||k=="avg")?1:-1}render()}
 else if(a=="save"){
  if(ui.busy)return;var d2=draft(),res=calc(d2.rows,S.settings),T=S.settings.start*4;
  if(!d2.date)return alert("日付を入れてください");
  if(!res)return alert("4人分のメンバーと素点を入力してください");
  if(new Set(d2.rows.map(x=>x.p)).size<4)return alert("同じメンバーが重複しています");
  if(d2.ym.some(y=>y.t=="ロン"&&(y.f===""||y.f===y.w)))return alert("役満のロンは、放銃した人（和了者以外）を選んでください");
  var ss=Math.round(d2.rows.reduce((x,y)=>x+ +y.s,0)*100);
  if(ss!=T&&!confirm("素点の合計が"+ss+"です（本来"+T+"）。このまま保存しますか？"))return;
  ui.busy=true;
  var old=S.games.find(g=>g.id==ui.edit),si=sessInfo();
  var g={id:ui.edit||Date.now().toString(36),t:old?old.t:Date.now(),date:d2.date,time:d2.time||"",sid:old?old.sid:(si.sid||"s"+Date.now().toString(36)),ps:d2.rows.map((x,z)=>Object.assign({p:x.p,s:Math.round(+x.s*100)},res[z])),
   ym:d2.ym.map(y=>({w:d2.rows[y.w].p,k:y.k,t:y.t,f:y.t=="ロン"&&y.f!==""?d2.rows[y.f].p:""}))};
  S.games=S.games.filter(x=>x.id!=g.id).concat(g);
  play(g.ym.length?FAN:BLIP);
  try{localStorage.removeItem("mjd")}catch(er){}
  if(ui.edit){ui.edit=null;ui.undo=null;ui.dr=null;ui.tab="hist"}
  else{ui.undo={id:g.id,n:si.n};var ids=d2.rows.map(x=>x.p);ui.dr=null;newDr(ids,d2.date,true)}
  window.scrollTo(0,0);await save();ui.busy=false}
 else if(a=="undo"){if(confirm("今保存した対局を取り消しますか？")){S.games=S.games.filter(x=>x.id!=ui.undo.id);ui.undo=null;cleanSess();await save()}}
 else if(a=="cancel"){ui.edit=null;ui.dr=null;newDr();render()}
 else if(a=="edit"){var g2=S.games.find(x=>x.id==k),ix=p=>g2.ps.findIndex(x=>x.p==p);
  ui.dr={date:g2.date,time:g2.time||"",flip:false,rows:g2.ps.map(x=>({p:x.p,s:String(x.s/100),au:false})),ym:(g2.ym||[]).map(y=>({w:ix(y.w),k:y.k,t:y.t,f:y.f?ix(y.f):""}))};ui.edit=k;ui.undo=null;ui.tab="input";render()}
 else if(a=="del"){if(confirm("この対局を削除しますか？")){S.games=S.games.filter(x=>x.id!=k);cleanSess();await save()}}
 else if(a=="split"){var g3=S.games.find(x=>x.id==k);if(confirm("この対局以降を、新しい会として分けますか？")){var ns="s"+Date.now().toString(36);S.games.forEach(x=>{if(x.sid==g3.sid&&cmpA(x,g3)>=0)x.sid=ns});await save()}}
 else if(a=="mergeS"){var g4=S.games.find(x=>x.id==k),asc=sessions().reverse(),ix2=asc.findIndex(s=>s.sid==g4.sid);
  if(ix2>0&&confirm("この会を前の会にまとめますか？（チップ枚数は合算されます）")){var pid=asc[ix2-1].sid,pc2=so(pid).chips,cc=(S.sess[g4.sid]||{}).chips||{};
   Object.keys(cc).forEach(id=>{pc2[id]=String((+pc2[id]||0)+ +cc[id])});S.games.forEach(x=>{if(x.sid==g4.sid)x.sid=pid});cleanSess();await save()}}
 else if(a=="tosettle"){ui.sid=k;ui.tab="settle";render()}
 else if(a=="ann"){var s0=sessions().find(x=>x.sid==k);if(!s0)return;var txt=announce(s0);ui.annSid=k;ui.annText=txt;var el=document.getElementById("annT");if(el)el.textContent=txt;play(JING);speak(txt)}
 else if(a=="annstop"){try{window.speechSynthesis.cancel()}catch(er){}}
 else if(a=="cadj"){var ch=so(ui.sid).chips,id=b.dataset.id;ch[id]=String((ch[id]===undefined||ch[id]===""?0:+ch[id])+ +b.dataset.d);await save()}
 else if(a=="cclr"){delete so(ui.sid).chips[b.dataset.id];await save()}
 else if(a=="addp"){var v=document.getElementById("np").value.trim();if(!v)return;S.players.push({id:"p"+Date.now().toString(36),name:v,reg:S.players.filter(p=>p.reg).length<4});await save()}
 else if(a=="ren"){var p=S.players.find(x=>x.id==k),nv=prompt("新しい名前",p.name);if(nv&&nv.trim()){p.name=nv.trim();await save()}}
 else if(a=="reg"){var p2=S.players.find(x=>x.id==k);p2.reg=!p2.reg;await save()}
 else if(a=="wipe"){if(confirm("全ての対局記録とチップ記録を削除します。よろしいですか？")&&confirm("本当に削除しますか？（元に戻せません）")){S.games=[];S.sess={};ui.undo=null;ui.dr=null;try{localStorage.removeItem("mjd")}catch(er){}await save()}}
 else if(a=="exj"){dl("mahjong_"+today()+".json",JSON.stringify(S,null,1),"application/json");await backed()}
 else if(a=="exc"){var L=["日付,時刻,会,対局,席,名前,順位,素点,順位pt,役満"],ss2=sessions().reverse(),C=["","会の開始日,名前,チップ枚数"];
  ss2.forEach(s=>{s.gs.forEach((g,gi)=>g.ps.forEach((x,z)=>{L.push([g.date,g.time||"",s.sd,gi+1,WN[z],'"'+nm(x.p).replace(/"/g,'""')+'"',x.rank,x.s,x.pt,'"'+(g.ym||[]).filter(y=>y.w==x.p).map(y=>y.k).join("/")+'"'].join(","))}));
   settle(s).rows.forEach(r=>{C.push([s.sd,'"'+nm(r.id).replace(/"/g,'""')+'"',r.c==null?"":r.c].join(","))})});
  dl("mahjong_"+today()+".csv","\ufeff"+L.concat(C).join("\r\n"),"text/csv");await backed()}
 else if(a=="ytest"){var ta=q('[data-t2="yomi"]');if(ta)S.settings.yomi=ta.value;
  var ws=(S.settings.yomi||"").split("\n").map(l=>l.split("=")[0].trim()).filter(Boolean),tx=ws.length?ws.join("。"):"半荘と役満の読みテストです。国士無双。大三元。";
  var yt=document.getElementById("yT");if(yt)yt.textContent="読み上げ："+yomi(tx);speak(tx)}
 else if(a=="cx"){ui.exp=null;render()}
 else if(a=="imp")document.getElementById("fi").click()});

if(local){var x=localStorage.getItem("mj");if(x)merge(JSON.parse(x));render()}
else{try{firebase.initializeApp(FB);var db=firebase.firestore();db.settings({experimentalForceLongPolling:true});ref=db.collection("mahjong").doc("data");
 ref.onSnapshot(s=>{if(dirty)return;if(s.exists)merge(s.data());render()},e=>{app.textContent="Firebase接続エラー: "+e.message});render()}
 catch(e){app.textContent="Firebaseの読み込みに失敗しました: "+e.message}}
}
boot();
</script></body></html>
